schema: 1
defaultRole: po
defaultBranch: main
codeHost: local
identities:
  - id: po@veri.example
    name: Priya Owens
    roles:
      - po
  - id: eng@veri.example
    name: Eli Ng
    roles:
      - eng
      - tech_lead
  - id: platform@veri.example
    name: Platform team
    roles:
      - platform
  - id: security@veri.example
    name: Security lead
    roles:
      - security
thresholds:
  autoFilesMax: 12
  maxLoopRounds: 5
  sessionCeiling: 4
  suiteMinSize: 20
records:
  intent: repo
  spec: repo
  plan: repo
  evals: repo
  pr: repo
  incident: external
  connector: records
evals:
  mode: continuous
  threshold: 0.9
eligibility:
  coverage: lenient
products:
  - name: invoicing
    path: .
environments:
  - name: preview
    kind: preview
    description: Per-change preview stack
    deploy:
      command: echo deploy preview $SDLC_SHA
    rollback:
      command: echo rollback preview to previous release
  - name: staging
    kind: staging
    description: Shared staging
    deploy:
      command: echo deploy staging $SDLC_SHA
    rollback:
      command: echo rollback staging to previous release
    healthcheck:
      command: echo staging healthy
  - name: production
    kind: production
    description: Customer-facing
    deploy:
      command: echo deploy production $SDLC_SHA
    rollback:
      command: echo rollback production to previous release
    healthcheck:
      command: echo production healthy
    gate:
      roles:
        - eng

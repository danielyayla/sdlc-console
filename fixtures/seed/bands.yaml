baselineWindow: 30d
detectEvery: 15m
metrics:
  - metric: p95_latency_ms
    baseline: 310
    unit: ms
    sigma: 40
    rules: [western-electric]
    tiers:
      1sigma: { action: log }
      2sigma: { action: diagnose, tools: [Read, Grep, "Bash(gh run view *)"] }
      3sigma: { action: propose, routes: [pr, "runbook:rollback"] }
  - metric: error_rate_pct
    baseline: 0.4
    unit: "%"
    sigma: 0.15
    rules: [western-electric]
    tiers:
      1sigma: { action: log }
      2sigma: { action: diagnose, tools: [Read, Grep] }
      3sigma: { action: propose, routes: [pr] }
runbooks:
  - id: rollback
    command: "echo rollback: redeploy the previous release (rehearsed in staging)"
    description: Roll the export service back to the previous release.

# Generated by sdlc init — the eval suite as the config-change gate (blueprint FR-52).
# A PR touching CLAUDE.md, .claude/** or sdlc/config.yaml runs the suite; `sdlc evals gate` fails the
# check when the run is below threshold (incomplete never passes) and lists regressed cases with
# before/after output. Scheduled and manual runs push their run file to the sdlc/evals-runs branch.
# Make "sdlc evals / config-change gate" a required status in branch protection to block merges.
name: sdlc evals
on:
  pull_request:
    paths:
      - CLAUDE.md
      - ".claude/**"
      - sdlc/config.yaml
      - "evals/cases/**"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sdlc-evals-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  suite:
    name: config-change gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run the suite
        run: node packages/cli/dist/bin.js evals run --trigger ${{ github.event_name == 'pull_request' && 'config-pr' || github.event_name == 'schedule' && 'schedule' || 'manual' }} --json
        env:
          SDLC_IDENTITY: sdlc-bot@sdlc.local
      - name: Keep the run file (PR branch)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The suite takes minutes; the PR may have merged or closed meanwhile. A push then would land on a
          # branch nobody reads and never reach the default branch, so the run file stays in the job log.
          state=$(gh pr view "${{ github.event.pull_request.number }}" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "PR #${{ github.event.pull_request.number }} is $state; not pushing the run file to ${{ github.head_ref }}"
            exit 0
          fi
          git push origin HEAD:${{ github.head_ref }}
      - name: Keep the run file (sdlc/evals-runs)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:refs/heads/sdlc/evals-runs
          gh pr create --head sdlc/evals-runs --base "${{ github.event.repository.default_branch }}" --title "sdlc: eval suite runs" --body "Run files the suite committed on schedule or by hand. Merge to bring the history onto the default branch." 2>/dev/null || true
      - name: Config-change gate
        if: github.event_name == 'pull_request'
        run: node packages/cli/dist/bin.js evals gate

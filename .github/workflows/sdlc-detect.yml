# Generated by sdlc init — the deterministic detection script on a schedule (blueprint FR-60, build-order 3.4).
# Runs every `source:` in bands.yaml, prints the Bands table with the sources' output verbatim, and fails the job
# at 2σ or beyond (exit 2) or when a source fails (exit 1). It commits nothing: the console's own schedule
# (`sdlc serve --engine`, bands.yaml detectEvery) is what raises triage items and diagnose/propose jobs.
name: sdlc detect
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Detect
        run: node packages/cli/dist/bin.js detect
      - name: Keep the snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-snapshots
          path: .sdlc-state/snapshots
          if-no-files-found: ignore

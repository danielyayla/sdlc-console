# Generated by sdlc init — lifecycle files validate on every pull request.
name: sdlc validate
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: node packages/cli/dist/bin.js validate
